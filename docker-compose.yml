services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-babycal}
      POSTGRES_USER: ${POSTGRES_USER:-babycal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-babycal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-babycal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-babycal}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind mounts (not named volumes) so a host-level reverse proxy (e.g. an
      # existing system Nginx already serving other sites) can alias directly
      # into these directories — see README.md "Behind an existing host Nginx".
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      # Bound to localhost only: reachable from a host-level reverse proxy,
      # never directly from the internet. Omit/remove this if you use the
      # `standalone-nginx` profile below instead (it talks to `web` over the
      # internal compose network and doesn't need this published).
      - "127.0.0.1:8000:8000"

  # --- Optional: containerized Nginx + certbot, for a VM dedicated to BabyCal ---
  # Not started by default (needs `--profile standalone-nginx`) because it binds
  # host ports 80/443, which conflicts with a pre-existing system Nginx serving
  # other sites. If that's your setup, skip this profile entirely and follow
  # README.md's "Behind an existing host Nginx" section instead.
  nginx:
    image: nginx:alpine
    profiles: ["standalone-nginx"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      # Mounted outside /etc/nginx/templates/ on purpose — that path triggers
      # nginx's own (unrestricted) envsubst pass over ALL env vars, which can
      # mangle directives like $host. We do our own restricted substitution below.
      #
      # Defaults to the HTTP-only bootstrap config so `docker compose up` works
      # out of the box with no domain/certs. Switch to babycal.conf.template
      # once you have a real domain and have run the certbot bootstrap (README.md).
      - ./nginx/conf.d/babycal-bootstrap.conf.template:/etc/nginx/babycal.conf.template:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && envsubst '$$DOMAIN_NAME' < /etc/nginx/babycal.conf.template > /etc/nginx/conf.d/babycal.conf && exec nginx -g 'daemon off;'"
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    profiles: ["standalone-nginx"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"

volumes:
  postgres_data:
  certbot_conf:
  certbot_www:
